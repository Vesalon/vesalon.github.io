---
layout: base
---
<main class="page">
  <h1>{{ page.title }}</h1>

  <ul class="blog-list">
    {% for post in site.posts %}
    <li class="blog-item">
      <div class="blog-date">{{ post.date | date: "%B %-d, %Y" }}</div>
      <h2 class="blog-title"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
      {% if post.excerpt %}
      <p class="blog-excerpt">{{ post.excerpt | strip_html | truncate: 200 }}</p>
      {% endif %}
    </li>
    {% endfor %}
  </ul>
</main>
