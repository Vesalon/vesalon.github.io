<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tessellation - {{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <style>
      body { overflow: hidden; }
      #canvas { position: fixed; inset: 0; display: block; }
      .back {
        position: fixed;
        top: 1.5rem;
        left: 1.5rem;
        z-index: 10;
        padding: 0.35rem 0.7rem;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.6);
        font-size: 0.9rem;
        color: #888;
      }
      #toggle-btn {
        position: fixed;
        bottom: 1.5rem;
        right: 1.5rem;
        z-index: 10;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-size: 1.1rem;
        cursor: pointer;
        backdrop-filter: blur(8px);
      }
      #toggle-btn:hover { border-color: rgba(255, 255, 255, 0.5); }
      body.no-webgl #toggle-btn { display: none; }
    </style>
    <script src="{{ '/assets/js/gl-components.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/sketch-webgl.js' | relative_url }}"></script>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <a class="back" href="{{ '/gallery/' | relative_url }}">← Gallery</a>
    <button id="toggle-btn" onclick="toggleAnimation()" aria-label="Pause animation">❚❚</button>
  </body>
</html>
